meta:
  name: Michael Clark
  link:
    home: https://m-clark.github.io

logo:
  small: img/mc_logo.png
  medium: img/mc_logo.png

color:
  palette:
    primary-red: "#753742"
    secondary-red: "#b33951"
    primary-blue: "#084887"
    light-blue: "#BFCDE0"
    dark-blue: "#313D5A"
    off-white: "#FEFCFD"
    body-text: "#404040"
    link-blue: "#1f77b4"

typography:
  fonts:
    - family: Source Sans 3
      source: google
      weight: [300, 400, 500, 600, 700, 800]
    - family: Roboto
      source: google
      weight: [300, 400, 500, 600, 700, 800]
    - family: Roboto Condensed
      source: google
    - family: Roboto Mono
      source: google
    - family: Open Sans Condensed
      source: google
      weight: [300]
  base:
    family: "Source Sans 3, Roboto, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol"
  headings:
    family: "Open Sans Condensed, Roboto Condensed, Roboto, sans-serif"
  monospace:
    family: "Roboto Mono, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace"
